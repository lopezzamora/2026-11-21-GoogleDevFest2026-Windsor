metrics_to_run:
  - valid_trip_plan_rate
  - custom_response_quality

# Thresholds set for the evaluation runner:
# valid_trip_plan_rate target from Slide 9 is 1.0 (100% of cases pass)
# custom_response_quality target is 4.0 (1-5 scale)
thresholds:
  valid_trip_plan_rate: 1.0
  custom_response_quality: 4.0

custom_metrics:
  # Slide 9 metric: CampSeeker Valid Trip Plan Rate (binary 1/0 scoring constraints and grounding)
  - name: valid_trip_plan_rate
    custom_function_file: valid_trip_plan_rate.py

  # Rubric-based judge scoring 1-5 (grounding, boundaries, uncertainty)
  - name: custom_response_quality
    custom_function_file: response_quality.py

  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          return {'score': len(turns)}
